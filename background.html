<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="text-white">

  <!-- Hero Section -->
  <section
    class="relative h-screen w-full bg-cover bg-center bg-no-repeat"
    style="background-image: url('https://cdn.mos.cms.futurecdn.net/xgCvDXPeqkbSZbK9Vn5d8S.gif');">

    <!-- Overlay (shadow for text visibility) -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Content -->
    <div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-6">
      <h1 class="text-5xl md:text-6xl font-bold mb-6">Welcome to My Website</h1>
      <p class="text-lg md:text-xl max-w-2xl mb-8">
        Enjoy smooth animation background with beautiful modern UI.
      </p>
      <button class="px-8 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-semibold text-lg">
        Get Started
      </button>
    </div>

  </section>

</body>

</html>
