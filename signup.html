<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Sign Up</title>
</head>
<style>
    body {
        background: linear-gradient(135deg, #0071e3, #00d4ff);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", sans-serif;
      }
       .card {
        border-radius: 1rem;
        padding: 2rem;
        background: #fff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        transition: transform 0.3s, box-shadow 0.3s;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
      }

      h3 {
        font-weight: 700;
        color: #0071e3;
        text-align: center;
        margin-bottom: 1.5rem;
      }

      .form-control:focus {
        border-color: #0071e3;
        box-shadow: 0 0 5px rgba(0, 113, 227, 0.5);
      }

      .btn-primary {
        background: linear-gradient(90deg, #0071e3, #00d4ff);
        border: none;
        font-weight: 600;
        transition: all 0.3s;
      }

      .btn-primary:hover {
        background: linear-gradient(90deg, #005bb5, #0099cc);
        transform: translateY(-2px);
      }

      #alertBox {
        margin-bottom: 1rem;
      }
</style>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>

    <form>

      <!-- Full Name -->
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Full Name</label>
        <input
          type="text"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your full name"
          required
        />
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Email</label>
        <input
          type="email"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your email"
          required
        />
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Password</label>
        <div class="relative">
          <input
            id="password"
            type="password"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
            placeholder="Create a password"
            required
          />
          <span onclick="togglePassword('password')"
                class="absolute right-3 top-2.5 cursor-pointer text-gray-500">👁️</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-6">
        <label class="block mb-1 font-semibold">Confirm Password</label>
        <div class="relative">
          <input
            id="confirmPassword"
            type="password"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
            placeholder="Confirm your password"
            required
          />
          <span onclick="togglePassword('confirmPassword')"
                class="absolute right-3 top-2.5 cursor-pointer text-gray-500">👁️</span>
        </div>
      </div>

      <!-- Sign Up Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
        Sign Up
      </button>

    </form>

    <p class="text-center mt-4 text-sm">
      Already have an account?
      <a href="#" class="text-blue-600 font-semibold">Login</a>
    </p>
  </div>

  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
